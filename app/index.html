<!doctype html>
<html lang="en" data-theme="classic" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>Vinaraa</title>
    <style>html,body,#root{background:#000000; color:#ffffff; margin:0; height:100%; width:100%; overflow:hidden;}</style>
    <script>
      (function() {
        try {
          var prefsRaw = localStorage.getItem('vinaraa.prefs');
          var prefs = prefsRaw ? JSON.parse(prefsRaw) : {};
          var theme = prefs.theme || 'classic';
          var mode = prefs.mode || 'system';
          var resolvedMode = mode;
          if (mode === 'system') {
            resolvedMode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-mode', resolvedMode);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'classic');
          document.documentElement.setAttribute('data-mode', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
