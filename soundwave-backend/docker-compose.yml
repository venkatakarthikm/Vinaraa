version: '3.8'

services:
  api:
    build: .
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: production
      PORT: 8080
      MONGODB_URI: mongodb://mongo:27017/soundwave
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-0123456789abcdef}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-0123456789abcdef}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-admin-key}
      UPSTREAM_URLS: ${UPSTREAM_URLS:-https://jiosaavn-api.apicoolie.workers.dev}
      UPSTREAM_PATH_PREFIX: ${UPSTREAM_PATH_PREFIX:-/api}
      CORS_ORIGINS: '*'
      TRUST_PROXY: '1'
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
